    ========================== -->

        content="#0d1424"
    >

        href="https://chessmovelab.pages.dev/"
    >


    <!-- =========================
         SOCIAL MEDIA PREVIEW
    ========================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="ChessMoveLab"
    >

    <meta
        property="og:title"
        content="Free Chess Game Analyzer | ChessMoveLab"
    >

        content="Analyze your chess games with Stockfish. Find your best moves, mistakes, blunders, openings and estimated game performance."
    >

    <meta
        property="og:url"
        content="https://chessmovelab.pages.dev/"
    >


    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Free Chess Game Analyzer | ChessMoveLab"
    >

    <meta
        name="twitter:description"
        content="Analyze your chess games with Stockfish and discover your best moves, mistakes, blunders and game performance."
    >


    <!-- =========================
         FAVICON
    ========================== -->

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>"
    >


    <!-- =========================
         STRUCTURED DATA
    ========================== -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ChessMoveLab",
        "url": "https://chessmovelab.pages.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "description": "Free chess game analyzer powered by Stockfish evaluations. Review moves, openings, mistakes, blunders and game performance.",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>


    <!-- =========================
         STYLES
    ========================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="hero">

        <!-- =========================
             BRAND
        ========================== -->

        <div
            class="logo-box"
            aria-hidden="true"
        >
            ♞
        </div>

        <p class="small-title">
            CHESSMOVELAB
        </p>

        <h1>
            Analyze Your Chess Games
        </h1>

        <p class="description">
            Analyze your recent Chess.com games with Stockfish,
            review your moves and discover mistakes, blunders,
            best moves and openings.
        </p>


        <!-- =========================
             USERNAME SEARCH
        ========================== -->

        <div class="search-card">

            <label for="username">
                Chess.com Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                enterkeyhint="search"
                aria-describedby="message"
            >

            <button
                id="searchBtn"
                type="button"
            >
                Find My Games
            </button>

            <p
                id="message"
                aria-live="polite"
            ></p>

        </div>


        <!-- =========================
             GAMES RESULTS
        ========================== -->

        <section
            id="gamesSection"
            class="games-section"
            hidden
        >

            <div class="section-header">

                <div>

                    <p class="small-title">
                        RECENT GAMES
                    </p>

                    <h2>
                        Your Chess.com Games
                    </h2>

                </div>

                <p id="gamesCount"></p>

            </div>


            <div
                id="gamesList"
                class="games-list"
            ></div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
